[project]
name = "nicokara-studio-next-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "cmudict>=1.1,<2",
  "Janome>=0.5,<1",
  "pydantic-settings>=2.10,<3",
  "pyphen>=0.17,<1",
  "pykakasi>=2.3,<3",
  "pypinyin>=0.55,<1",
  "python-multipart>=0.0.20,<1",
  "uvicorn[standard]>=0.35,<1",
]
[project.optional-dependencies]
analysis = [
  "audioread>=3.0,<4",
  "audio-separator[cpu]>=0.44.5,<0.45",
  "faster-whisper>=1.2,<2",
  "torch>=2.7,<3",
  "torchaudio>=2.7,<3",
  "librosa>=0.10,<0.11",
  "soundfile>=0.12,<1",
  "stable-ts-whisperless==2.19.1",
  "transformers>=4.48,<5",
  "onnxruntime-directml>=1.24,<2; platform_system == 'Windows'",
]
dev = ["pytest>=8.0,<9", "httpx2>=2,<3"]
[tool.pytest.ini_options]
pythonpath = ["."]
